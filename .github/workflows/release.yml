name: Publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Configure o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Configure o secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Configure o secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitsune.jks"

      - name: Testar e compilar
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kitsune.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Guardar APK do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publicar no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Kitsune-${GITHUB_REF_NAME}.apk"
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.txt"
          test -s "$notes_file" || { echo "As notas da release $GITHUB_REF_NAME nao foram encontradas."; exit 1; }
          notes="$(cat "$notes_file")"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Kitsune $GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes"
          fi
