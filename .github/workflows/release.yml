name: Publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Configure o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Configure o secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Configure o secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitsune.jks"

      - name: Testar e compilar
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kitsune.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Guardar APK do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publicar no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.txt"
          test -s "$notes_file" || { echo "As notas da release $GITHUB_REF_NAME nao foram encontradas."; exit 1; }
          notes="$(cat "$notes_file")"
          mkdir -p release-assets
          for source in app/build/outputs/apk/release/*.apk; do
            file="$(basename "$source")"
            case "$file" in
              app-universal-release.apk) output="Kitsune-${GITHUB_REF_NAME}.apk" ;;
              app-*-release.apk)
                abi="${file#app-}"
                abi="${abi%-release.apk}"
                output="Kitsune-${GITHUB_REF_NAME}-${abi}.apk"
                ;;
              *) continue ;;
            esac
            cp "$source" "release-assets/$output"
            (cd release-assets && sha256sum "$output" > "$output.sha256")
          done
          test -s "release-assets/Kitsune-${GITHUB_REF_NAME}.apk" || { echo "APK universal nao encontrado."; exit 1; }
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Kitsune $GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes"
          fi
